# UI configuration template — copy to <LEDGER_DIR>/config/ui.yaml and edit.
# Loaded by the web app via ledger-data-api's /ui-config endpoint.
# All sections are optional; the app falls back to bundled defaults / hash-based
# rendering for any section omitted here.
#
# Convention: every section is a namespace. Cross-cutting registries (like
# `merchants:`) stay top-level; everything else groups under the feature
# namespace it belongs to (`accounts:`, `sidebar:`, …).

# ============================================================================
# Branding
# `title`    — main app name; shown in browser tab and sidebar header.
# `subtitle` — secondary line below the title in the sidebar.
# Note: the page title (browser tab) is baked at build time via
# NEXT_PUBLIC_APP_TITLE; coordinate that env var with `branding.title`.
# ============================================================================
branding:
  title: "My Ledger"
  subtitle: ""

# ============================================================================
# Accounts — anything keyed by beancount account path.
#
# `display_names`
#   Override the rendered label for an account. Default is the last colon
#   segment of the path; only list entries that materially differ.
#
# `logos`
#   Account-path → merchant name (Stage 2 of the logo resolver). Fires only
#   when the account itself identifies the brand more reliably than the
#   bank-side payee text. Income txns: matches against any posting;
#   non-income txns: matches against the category posting only — funding
#   postings are deliberately excluded to avoid "everything is Bilt" drift.
#   Value must be a brand name in `merchants:` below or in bundled defaults.
#
# `colors`
#   Hand-picked oklch colors keyed by full account path. Lookup walks
#   ancestors, so an entry on a parent applies to the whole subtree unless
#   overridden by a deeper match. Format: oklch(L C H) or oklch(L% C H).
#
# `category_icons`
#   Account-path → lucide icon name (kebab-case, e.g. "utensils", "plane",
#   "shopping-cart"; full set at https://lucide.dev/icons). Stage 4.5 of
#   the logo resolver — fires when payee resolution misses, so unrecognized
#   payees in known categories render as a meaningful glyph instead of a
#   letter mark. Bundled defaults cover the standard expense / income
#   taxonomy; entries here override or extend for personal account names.
#   Lookup walks ancestors. Income rows match against any posting;
#   non-income rows match the category leg only. Icons load via
#   lucide-react/dynamic — any valid lucide name works, no allowlist.
#
# `category_rollup`
#   Subtrees that collapse to a single bucket in charts. Any leaf descendant
#   of a listed prefix is aggregated under that prefix.
# ============================================================================
accounts:
  display_names:
    # "Expenses:Transportation:Public": "Public Transit"
    # "Assets:Investment:Brokerage:Roth-IRA": "Roth IRA"

  logos:
    # "Income:Salary:Acme": "Acme"
    # "Expenses:Home:Utilities": "PSEG"

  colors:
    # "Income:Salary": "oklch(0.66 0.21 130)"
    # "Expenses:Home": "oklch(0.51 0.22 17)"

  category_icons:
    # "Expenses:Food:Eating-Out": "utensils"  # non-standard taxonomy
    # "Income:Salary:Acme": "briefcase"        # personal override

  category_rollup:
    # - "Expenses:Transportation"
    # - "Income:Interest"

# ============================================================================
# Logo resolution pipeline
#
#   transaction in
#       │
#       ▼
#   [1] class glyph?        transfer / rebalance / investment / pending / forecast
#       │ no
#       ▼
#   [2] accounts.logos?     account-path → merchant-name              ◀── this file
#       │ no
#       ▼
#   [3] payee patterns?     bundled regex (Tm *, ACH Des:…) extracts a
#       │ no                token; matched against merchant `aliases`   ◀── this file
#       ▼
#   [4] payee → registry    cleanPayee strips bundled prefixes/suffixes
#       │ no                (Apple Pay -, Sq *, ZIP, state, …) then exact
#       │                   then longest-substring match against bundled
#       │                   defaults + `merchants:` (name + aliases)    ◀── this file
#       ▼
#   [4.5] category icon?    account-path of category posting → lucide  ◀── this file
#       │ no                glyph (walks ancestors; bundled defaults +
#       │                   `accounts.category_icons`)
#       ▼
#   [5] generic fallback    auto-derived letter + hash color
# ============================================================================

# ============================================================================
# Custom merchants (extends bundled registry, used by stages 2 + 3 + 4)
# Brands not in the app's bundled registry. Map keys are the human-readable
# brand name — used directly as the canonical id and the matched display name.
#   `domain`  — drives logo.dev image fetching (optional; falls back to a
#               letter mark if omitted or the image fails to load).
#   `aliases` — extra payee tokens (case-insensitive) that should also
#               resolve to this merchant.
# ============================================================================
merchants:
  # Acme:
  #   domain: "acme.com"
  # MyLandlord:
  #   aliases:
  #     - "ach landlord wire token"

# ============================================================================
# Sidebar
# `bookmarks` — shortcuts to clearing/holding accounts whose balances
# typically net to zero over time and benefit from one-tap access.
#   `id`          — stable identifier (kebab-case). Used for keys; not shown.
#   `label`       — short display name in the sidebar.
#   `root`        — top-level bucket (Assets / Liabilities / Income /
#                   Expenses / Equity).
#   `accountPath` — full beancount account path the bookmark links to.
# ============================================================================
sidebar:
  bookmarks:
    # - id: receivable
    #   label: "Receivable"
    #   root: "Assets"
    #   accountPath: "Assets:Receivable:Others"

# ============================================================================
# Investments — annotations for the Portfolio page.
#
# Sleeves are DISCOVERED by walking `Assets:Investment:*`; this block only
# annotates them. Every key is optional: with no `investments:` block the page
# still renders holdings, allocation and the value-vs-cost series — it just
# loses the tax chips, the contribution meters and the margin note.
#
# Security names and asset classes are NOT configured here. They come from
# `commodity` directives in the journal, which is where facts about an
# instrument belong:
#
#   2023-11-01 commodity TICKER
#     name: "Placeholder Index ETF"
#     asset-class: "us-large"
#
# `sleeves`
#   `account`              — full path of the sleeve. Lookup walks ancestors,
#                            so an entry covers the sleeve's `:USD` cash leaf
#                            and any sub-accounts.
#   `tax`                  — one of roth / traditional / hsa / taxable /
#                            401k / roth-401k.
#                            Drives the chip on the sleeve row. Unknown values
#                            are ignored rather than rejected.
#   `limit_key`            — contribution bucket this sleeve counts against.
#                            Sleeves sharing a key share one meter, which is
#                            how a Roth and a Traditional IRA sum against a
#                            single annual ceiling.
#   `margin_free_tranche`  — interest-free margin allowance the broker grants,
#                            in USD. Cash down to minus this figure renders
#                            neutral with a tooltip instead of in the
#                            liability tone; past it, it is real debt.
#
# `limits`
#   Year → limit key → annual ceiling. Keyed by year because statutory limits
#   change annually and past years must keep reconciling against their own.
#   A contribution counts toward the `tax-year:` metadata on the transaction
#   when present, otherwise the calendar year of its date.
#
# `cadence`
#   Limit key → recurring funding, for the "maxes out by …" projection.
#   `per` is one of day / week / month / quarter / year.
#
# `realized`
#   Income accounts the realized panel reads. Both are negative in Beancount
#   convention and get flipped for display.
#
# `asset_class_labels`
#   Asset-class slug (from the commodity directives above) → display label.
#   Unlisted slugs are de-slugified; a commodity with no `asset-class:` groups
#   under "Unclassified".
# ============================================================================
investments:
  sleeves:
    # - account: "Assets:Investment:Broker:Roth-IRA"
    #   tax: roth
    #   limit_key: ira
    # - account: "Assets:Investment:Broker:Traditional-IRA"
    #   tax: traditional
    #   limit_key: ira
    # - account: "Assets:Investment:Hsa-Provider:HSA"
    #   tax: hsa
    #   limit_key: hsa
    # - account: "Assets:Investment:Broker:Brokerage"
    #   tax: taxable
    #   margin_free_tranche: 1000
    # - account: "Assets:Investment:Retirement-Plan:Roth-401k"
    #   tax: 401k

  limits:
    # 2025: { ira: 7000, hsa: 4300 }
    # 2026: { ira: 7500, hsa: 4400 }

  cadence:
    # ira: { amount: 160, per: week }
    # hsa: { amount: 367, per: month }

  realized:
    # gains: "Income:Trading:Gains"
    # dividends: "Income:Trading:Dividends"

  asset_class_labels:
    # us-large: "US large-cap core"
    # us-small: "US small-cap"
    # intl-dev: "Developed intl"
    # emerging: "Emerging markets"
    # single-stock: "Single stocks"
    # crypto: "Crypto"
    # cash-short: "Cash & short-term"

  # `contributions.payroll_prefixes`
  #   Income subtrees whose negative leg funds a contribution (pre-tax payroll
  #   deferrals). Defaults to ["Income:Salary"]. Only used when a transaction
  #   carries no `contribution:` metadata: every other income leg, including a
  #   broker match, is ignored by construction so it never counts against an
  #   IRS limit.
  contributions:
    # payroll_prefixes: ["Income:Salary"]

# ============================================================================
# Planner — the plan grid served by ledger-data-api's `plan_grid` endpoint.
#
# `excluded_accounts`
#   Accounts the grid never shows a row for. Intended for holding / clearing /
#   forecast-scratchpad accounts whose running balance is noise rather than a
#   number to act on. Exact paths, no subtree walk. Omit the key to exclude
#   nothing.
# ============================================================================
planner:
  excluded_accounts:
    # - "Assets:Checking:Scratch"
    # - "Assets:Checking:Held-For-Someone-Else"

# ============================================================================
# Card balance — the `get_balance` endpoint behind the Chrome overlay
# (packages/card-balance-browser-extension), which passes a lowercase
# substring like `mybank` and gets back every matching account's balance.
#
# `accounts`
#   Regex fragments matched against the account path. Omit the key and the
#   endpoint scans the universal buckets below; list it to ADD paths (a
#   brokerage cash leaf, say), and keep the universal three or they drop out.
# ============================================================================
card_balance:
  accounts:
    # - "Assets:Checking"
    # - "Assets:Saving"
    # - "Liabilities:Credit"
    # - "Assets:Investment:Broker:Brokerage:USD"
