    scenarios:
      - id: next
        label: Next job
        job: { start: 2028-01, gross_annual: 120000, match: { type: flat, pct: 0.04 }, raise: null }
    starting:
      source: ledger
      rules:
        - { sleeve: checking, accounts: "^Assets:Checking:" }
        - { sleeve: ef, accounts: "^Assets:Saving:" }
        - { sleeve: reserve, accounts: "^Assets:Investment:Broker:(TBILL|USD)$" }
        - { sleeve: core, accounts: "^Assets:Investment:Broker:VTI$" }
        - { sleeve: play, accounts: "^Assets:Investment:Broker:" }
