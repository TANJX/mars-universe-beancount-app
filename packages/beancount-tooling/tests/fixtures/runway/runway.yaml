# Synthetic runway.yaml for test_runway_api.py.
version: 1
asof: 2026-11-08
start: 2026-11
months: 24
defaults:
  returns: { equity: 0.06 }
  limits: { 2028: { k401: 25000 } }
  spread_through: horizon
people:
  - id: alex
    label: Alex
    pay:
      schedule: { frequency: semimonthly, days: [15, -1] }
      deductions:
        - { label: Commuter, amount: 100, per: month, paycheck: 1, pretax: true }
      withholding: { state: ny_nonresident, state_payroll: { rate: 0.005, annual_cap: 400 } }
    jobs:
      - id: cur
        employer: Current job
        start: 2024-06
        salary:
          - { from: 2026-01, gross: 100000 }
          - { from: 2027-02, gross: 103000, note: review }
    contributions:
      - id: k401-pretax
        account: k401
        tax: traditional
        ytd: { 2026: 0 }
        schedule:
          - { from: 2026-11, pace: fixed, amount: 3000 }
      - id: ira-roth
        account: ira
        tax: roth
        schedule:
          - { from: 2026-11, pace: lump, month: 1, amount: 7000 }
    returns: { reserve: 0.04 }
    spending: { monthly: 3000 }
    cash: { buffer: 1000, ef_months: 3, earmarks: [], dca_months: 6 }
    scenarios:
      - id: next
        label: Next job
        patch:
          jobs:
            - { id: next, employer: New job, start: 2028-01, salary: [ { from: 2028-01, gross: 120000 } ], match: { type: flat, pct: 0.04 } }
      - id: no-ira
        label: No IRA
        patch:
          contributions:
            - { id: ira-roth, remove: true }
          spending: { monthly: 3200 }
    starting:
      source: ledger
      rules:
        - { sleeve: checking, accounts: "^Assets:Checking:" }
        - { sleeve: ef, accounts: "^Assets:Saving:" }
        - { sleeve: reserve, accounts: "^Assets:Investment:Broker:(TBILL|USD)$" }
        - { sleeve: core, accounts: "^Assets:Investment:Broker:VTI$" }
        - { sleeve: play, accounts: "^Assets:Investment:Broker:" }
      cards: "^Liabilities:Credit:"
      loans: "^Liabilities:Loan:"
  - include: partner/runway.yaml
    label: Sam (inline)
