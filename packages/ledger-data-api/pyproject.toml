[project]
name = "ledger-data-api"
version = "0.1.0"
description = "Fava extension exposing HTTP endpoints (balances, plans, transfers, CC payments) consumed by apps/web and card-balance-browser-extension."
authors = [
    { name = "TANJX", email = "marstanjx@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fava>=1.26.1",
    "beanquery>=0.1.dev0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_data_api"]
